name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt eclipse-sumo==1.26.0 traci==1.26.0

      - name: Lint with flake8
        run: |
          flake8 src/ scripts/ tests/ web/server.py --max-line-length=120 --ignore=E402,W503,E501

      - name: Run unit tests
        run: |
          pytest tests/ -m 'not integration' -v -x

      - name: Verify real SUMO integration (must not skip)
        run: |
          sumo --version
          python -c "import shutil; assert shutil.which('sumo')"
          sumo -c maps/tirupati/tirupati.sumocfg --end 1 --no-step-log true
          pytest tests/ -m integration -v -x

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the four-policy Tirupati smoke benchmark in Docker
        run: docker compose run --build --rm smoke
