x-rl-traffic: &rl-traffic
  build: .
  volumes:
    - ./maps:/app/maps:ro
    - ./config.yaml:/app/config.yaml:ro
    - ./results:/app/results

services:
  smoke:
    <<: *rl-traffic
    entrypoint: ["python", "scripts/run_experiments.py", "--config", "config.yaml", "--benchmark-profile", "smoke"]
    command: ["--output-dir", "results/docker-smoke"]

  train:
    <<: *rl-traffic
    entrypoint: ["python", "scripts/train.py"]
    command: ["--config", "config.yaml"]

  evaluate:
    <<: *rl-traffic
    entrypoint: ["python", "scripts/evaluate.py"]
    command: ["--help"]

  baseline:
    <<: *rl-traffic
    entrypoint: ["python", "scripts/baseline_fixed.py"]
    command: ["--config", "config.yaml", "--episodes", "5"]

  generalization:
    <<: *rl-traffic
    entrypoint: ["python", "scripts/evaluate_generalization.py"]
    command: ["--help"]
